spring.datasource.url=jdbc:h2:file:./data/rentit;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always

rentit.ai.provider=GEMINI
rentit.ai.gemini.api-key=${GEMINI_API_KEY:}
rentit.ai.gemini.model=gemini-2.0-flash
rentit.ai.gemini.base-url=https://generativelanguage.googleapis.com
rentit.ai.gemini.timeout-ms=8000
